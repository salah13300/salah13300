name: Relevé des prix Tesla

# Remplace le cron Vercel pour /api/prices/check : les fonctions serverless
# Vercel sont limitées à 300s d'exécution, insuffisant pour relever les 13
# pays x 5 modèles de façon fiable. Un job GitHub Actions n'a pas cette
# limite (jusqu'à 6h), donc on utilise directement le script
# scripts/check-prices.ts (checkAllPrices), prévu pour ça.
#
# 20/09/2026 : ScraperAPI puis un navigateur headless local ont été
# abandonnés — tesla.com bloque directement les IP des runners GitHub
# Actions (Akamai), un navigateur local n'y change rien. La récupération
# des prix est maintenant entièrement déléguée à l'agent IA
# (tesla-price-tracker/lib/aiAgent.ts, Claude + outil serveur web_fetch,
# exécuté depuis l'infrastructure Anthropic) — ANTHROPIC_API_KEY est donc
# requis pour que ce workflow fonctionne (secret à ajouter sur le repo,
# clé créée sur https://console.anthropic.com).
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tesla-price-tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tesla-price-tracker/package-lock.json

      - run: npm ci

      - run: npm run check-prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
